<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>OmniMind — бесплатный ИИ-чат без ключей: GPT, Mistral, Llama и другие</title>
<meta name="description" content="OmniMind — бесплатный аниме ИИ-чат без API-ключей. Несколько нейросетей в одном месте, режим программиста, переводчик, сравнение моделей, Premium.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://morozmaxim607-tech.github.io/omnimind/">
<meta property="og:type" content="website">
<meta property="og:title" content="OmniMind — бесплатный ИИ-чат">
<meta property="og:description" content="Несколько нейросетей в одном месте. Без ключей и оплаты.">
<meta property="og:url" content="https://morozmaxim607-tech.github.io/omnimind/">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"OmniMind","url":"https://morozmaxim607-tech.github.io/omnimind/","applicationCategory":"UtilitiesApplication","operatingSystem":"Any","description":"Бесплатный ИИ-чат с несколькими нейросетями в аниме-стиле.","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"}}</script>
<style>
:root{--bg1:#fff0f7;--bg2:#ece6ff;--bg3:#e0f5ff;--tx:#3a3355;--mut:#8a82ad;--pk:#ff6fae;--pu:#8b7bff;--card:#ffffffcc;--ln:#eadcff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.55 "Nunito","Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;overflow:hidden}
button,select,input,textarea{font:inherit;color:var(--tx);border:1px solid var(--ln);background:#fff;border-radius:14px;padding:9px 13px;outline:0}
button{cursor:pointer}button:active{transform:scale(.97)}
input:focus,textarea:focus,select:focus{border-color:var(--pu);box-shadow:0 0 0 3px #8b7bff33}
.g{background:linear-gradient(90deg,var(--pk),var(--pu));color:#fff;border:0;font-weight:700;box-shadow:0 4px 14px #ff6fae55}
#app{display:flex;height:100dvh;position:relative;z-index:1}
#sb{width:290px;background:var(--card);backdrop-filter:blur(14px);border-right:1px solid var(--ln);display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom));gap:8px;overflow-y:auto;z-index:20;transition:transform .25s}
.logo{font-weight:900;font-size:22px;background:linear-gradient(90deg,var(--pk),var(--pu));-webkit-background-clip:text;color:transparent;padding:2px 6px}
.sec{font-size:12px;color:var(--mut);font-weight:800;letter-spacing:.06em;margin:10px 6px 2px;text-transform:uppercase}
.it{display:flex;align-items:center;gap:6px;padding:9px 11px;border-radius:12px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.it.on{background:linear-gradient(90deg,#ff6fae22,#8b7bff22);font-weight:700}
.it span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it i{font-style:normal;color:var(--mut);padding:0 4px}
#list{flex:1;min-height:80px;overflow-y:auto}
.foot{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--ln);padding-top:10px}
.seo{font-size:11px;color:var(--mut);line-height:1.35;margin:0}
#mn{flex:1;display:flex;flex-direction:column;min-width:0}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
#bm{display:none;font-size:20px;padding:6px 12px}
#model{flex:1;max-width:300px;font-weight:700}
.badge{font-size:12px;padding:3px 10px;border-radius:99px;background:#fff;border:1px solid var(--ln);font-weight:800;margin-left:auto}.badge.pr{background:linear-gradient(90deg,#ffd86f,#ffb36f);border:0}
#chat{flex:1;overflow-y:auto;padding:8px 14px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.m{padding:11px 15px;border-radius:20px;max-width:90%;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 3px 14px #8b7bff1a}
.u{align-self:flex-end;background:linear-gradient(135deg,var(--pk),var(--pu));color:#fff;border-bottom-right-radius:6px}
.a{align-self:flex-start;background:#fff;border:1px solid var(--ln);border-bottom-left-radius:6px}
.m small{display:block;color:var(--pu);font-weight:800;margin-bottom:3px}
pre{background:#2b2646;color:#f3eeff;padding:11px;border-radius:12px;overflow-x:auto;margin:6px 0}
code{background:#f3eaff;padding:1px 6px;border-radius:6px}pre code{background:none;padding:0}
.w{margin:auto;text-align:center;padding:10px;max-width:520px}
.w h1{font-size:24px;margin:6px 0}.w p{color:var(--mut);margin:4px 0 12px}
.ch{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.ch button{font-size:14px}
.in{display:flex;gap:8px;align-items:flex-end;max-width:820px;width:100%;margin:0 auto;padding:8px 12px calc(12px + env(safe-area-inset-bottom))}
.in textarea{flex:1;resize:none;height:50px;max-height:140px;border-radius:24px;padding:12px 18px;background:#fff}
.in button{width:50px;height:50px;border-radius:50%;padding:0;font-size:20px}
#st{text-align:center;font-size:13px;color:var(--mut);min-height:18px}
#ov{display:none}
dialog{background:#fff;color:var(--tx);border:0;border-radius:22px;max-width:360px;width:92%;box-shadow:0 20px 60px #8b7bff55;padding:20px}
dialog::backdrop{background:#3a335577}dialog input{width:100%;margin:6px 0}dialog h3{margin:0 0 6px}
.row{display:flex;gap:8px;margin-top:8px}.row>*{flex:1}.mut{color:var(--mut);font-size:14px}
.petal{position:fixed;top:-30px;color:#ff9ac6;opacity:.7;pointer-events:none;z-index:0;animation:fall linear infinite}
@keyframes fall{to{transform:translate(60px,110vh) rotate(360deg)}}
@media(max-width:800px){
 #sb{position:fixed;left:0;top:0;bottom:0;transform:translateX(-102%);box-shadow:8px 0 30px #8b7bff44}
 #app.open #sb{transform:none}#app.open #ov{display:block;position:fixed;inset:0;background:#3a335544;z-index:15}
 #bm{display:block}}
@media(prefers-reduced-motion:reduce){.petal{display:none}}
</style>
</head>
<body>
<div id="app">
 <aside id="sb">
  <div class="logo">OmniMind ✿</div>
  <button class="g it" id="nc" style="justify-content:center">＋ Новый чат</button>
  <div class="sec">Режим</div><div id="modes"></div>
  <div class="sec">Чаты</div><div id="list"></div>
  <div class="foot">
   <button class="g" id="bPrem">★ Premium</button>
   <button id="bAuth">Войти</button>
   <p class="seo">OmniMind — бесплатный ИИ-чат без ключей. Несколько нейросетей, режимы программиста, писателя и переводчика, сравнение ответов.</p>
  </div>
 </aside>
 <div id="ov"></div>
 <section id="mn">
  <div class="top"><button id="bm" aria-label="Меню">☰</button><select id="model" aria-label="Модель"></select><span id="badge" class="badge"></span></div>
  <div id="chat"></div>
  <div id="st"></div>
  <div class="in"><textarea id="q" placeholder="Напишите сообщение…" rows="1"></textarea><button id="bSend" class="g" aria-label="Отправить">➤</button></div>
 </section>
</div>

<dialog id="dAuth"><h3 id="aT">Вход</h3>
 <input id="em" type="email" placeholder="Email" autocomplete="email" autocapitalize="off" autocorrect="off">
 <input id="pw" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
 <div class="row"><button class="g" id="aOk">Войти</button><button id="aSw">Регистрация</button></div>
 <p class="mut" id="aE"></p><button onclick="dAuth.close()" style="width:100%">Закрыть</button></dialog>

<dialog id="dPrem"><h3>★ Premium</h3>
 <p class="mut">Все модели, режим «Сравнить 3 ИИ», без лимита сообщений. Введите код владельца, чтобы выдать Premium себе.</p>
 <input id="code" type="password" placeholder="Код владельца" autocapitalize="off" autocorrect="off" autocomplete="off">
 <div class="row"><button class="g" id="pOk">Активировать</button><button id="pOff">Отключить</button></div>
 <p class="mut" id="pE"></p><button onclick="dPrem.close()" style="width:100%">Закрыть</button></dialog>

<script>
const ADMIN_CODE="omnimind2026"; // ← ЗАМЕНИТЕ на свой код (маленькие латинские буквы и цифры)
const FREE_LIMIT=15;
const API="https://text.pollinations.ai/";
const SYS={chat:"Ты Омни-тян, дружелюбный ИИ-помощник. Отвечай на языке пользователя, точно и по делу, можно с лёгким тёплым тоном.",
code:"Ты эксперт-программист уровня senior. Пиши рабочий код в блоках ```, объясняй кратко, указывай подводные камни.",
write:"Ты талантливый писатель и редактор. Пиши живо, образно и грамотно.",
tr:"Ты профессиональный переводчик. Переводи точно, сохраняя стиль; если язык не указан — между русским и английским."};
const MODES=[["chat","💬 Обычный"],["code","👨‍💻 Программист"],["write","✍️ Писатель"],["tr","🌍 Переводчик"],["cmp","⚖️ Сравнить 3 ИИ ★"]];
let MODELS=[{n:"GPT (быстрый)",id:"openai",p:false},{n:"Mistral",id:"mistral",p:true},{n:"Llama",id:"llama",p:true},{n:"DeepSeek",id:"deepseek",p:true}];
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms));
const L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
const S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=t=>esc(t).replace(/```\w*\n?([\s\S]*?)```/g,"<pre><code>$1</code></pre>").replace(/`([^`\n]+)`/g,"<code>$1</code>").replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>");
let authMode="in",mode="chat",chats=[],cid=0,busy=false;
const users=()=>L("om_users",{}),cur=()=>L("om_cur",null);
const isPrem=()=>{const u=cur();return !!(u&&users()[u]&&users()[u].premium)};
const day=()=>new Date().toISOString().slice(0,10);
const cnt=()=>L("om_c_"+cur()+day(),0);
const chat=()=>chats.find(c=>c.id===cid);
const saveCh=()=>{if(cur())S("om_ch_"+cur(),chats.slice(0,40))};
async function sha(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("omnimind:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return "p:"+btoa(unescape(encodeURIComponent(s)))}}

function newChat(){const c={id:Date.now(),t:"Новый чат",m:[]};chats.unshift(c);cid=c.id;saveCh();ui();closeSb()}
function ui(){
 const u=cur(),pr=isPrem();
 $("#bAuth").textContent=u?"Выйти ("+u.split("@")[0]+")":"Войти / Регистрация";
 $("#badge").textContent=u?(pr?"★ Premium":"Free · "+Math.max(0,FREE_LIMIT-cnt())):"";$("#badge").className="badge"+(pr?" pr":"");
 const sel=$("#model"),old=sel.value;
 sel.innerHTML=MODELS.map(m=>`<option value="${esc(m.id)}">${esc(m.n)}${m.p&&!pr?" 🔒":""}</option>`).join("");
 if(old&&MODELS.some(m=>m.id===old))sel.value=old;
 $("#modes").innerHTML=MODES.map(m=>`<button class="it ${m[0]===mode?"on":""}" data-m="${m[0]}"><span>${m[1]}</span></button>`).join("");
 $("#list").innerHTML=chats.map(c=>`<div class="it ${c.id===cid?"on":""}" data-c="${c.id}"><span>${esc(c.t)}</span><i data-d="${c.id}">✕</i></div>`).join("");
 draw();
}
function draw(){
 const c=chat(),el=$("#chat");
 if(!c||!c.m.length){el.innerHTML=`<div class="w"><svg width="120" height="120" viewBox="0 0 120 120" aria-hidden="true"><path d="M20 60Q18 14 60 12Q102 14 100 60Q96 30 60 30Q24 30 20 60Z" fill="#ff8fc0"/><circle cx="60" cy="66" r="38" fill="#fff0e6"/><path d="M22 62Q30 24 60 24Q90 24 98 62Q80 40 60 42Q40 40 22 62Z" fill="#ff8fc0"/><ellipse cx="46" cy="68" rx="7" ry="10" fill="#4a3f7a"/><ellipse cx="74" cy="68" rx="7" ry="10" fill="#4a3f7a"/><circle cx="48" cy="64" r="3" fill="#fff"/><circle cx="76" cy="64" r="3" fill="#fff"/><ellipse cx="36" cy="82" rx="7" ry="4" fill="#ffb3cf" opacity=".8"/><ellipse cx="84" cy="82" rx="7" ry="4" fill="#ffb3cf" opacity=".8"/><path d="M54 86Q60 92 66 86" stroke="#c4577f" stroke-width="3" fill="none" stroke-linecap="round"/></svg><h1>Привет! Я Омни-тян ✿</h1><p>Бесплатный ИИ-чат без ключей. Спрашивайте про код, тексты, переводы и всё на свете.</p><div class="ch"><button data-s="Объясни простыми словами, как работает интернет">🌐 Как работает интернет</button><button data-s="Напиши на Python игру «угадай число»">🐍 Игра на Python</button><button data-s="Придумай 5 идей для аниме-сюжета">🌸 Идеи для аниме</button></div></div>`;return}
 el.innerHTML=c.m.map(m=>`<div class="m ${m.role==="user"?"u":"a"}">${m.label?`<small>${esc(m.label)}</small>`:""}${fmt(m.content)}</div>`).join("");
 el.scrollTop=el.scrollHeight;
}
function openSb(){$("#app").classList.add("open")}function closeSb(){$("#app").classList.remove("open")}
$("#bm").onclick=openSb;$("#ov").onclick=closeSb;$("#nc").onclick=newChat;
$("#modes").onclick=e=>{const b=e.target.closest("[data-m]");if(b){mode=b.dataset.m;ui();closeSb()}};
$("#list").onclick=e=>{
 const d=e.target.closest("[data-d]");
 if(d){chats=chats.filter(c=>c.id!=d.dataset.d);if(!chats.length)return newChat();if(!chat())cid=chats[0].id;saveCh();return ui()}
 const c=e.target.closest("[data-c]");if(c){cid=+c.dataset.c;ui();closeSb()}};
$("#chat").onclick=e=>{const b=e.target.closest("[data-s]");if(b){$("#q").value=b.dataset.s;send()}};

function loadUser(){const u=cur();chats=u?L("om_ch_"+u,[]):[];if(!chats.length){chats=[{id:Date.now(),t:"Новый чат",m:[]}]}cid=chats[0].id;ui()}
$("#bAuth").onclick=()=>{if(cur()){localStorage.removeItem("om_cur");loadUser()}else{authMode="in";authUI();dAuth.showModal()}closeSb()};
function authUI(){$("#aT").textContent=authMode==="in"?"Вход":"Регистрация";$("#aOk").textContent=authMode==="in"?"Войти":"Создать аккаунт";$("#aSw").textContent=authMode==="in"?"Регистрация":"Уже есть аккаунт";$("#aE").textContent=""}
$("#aSw").onclick=()=>{authMode=authMode==="in"?"up":"in";authUI()};
async function doAuth(){
 const e=$("#em").value.trim().toLowerCase(),p=$("#pw").value;
 if(!/^\S+@\S+\.\S+$/.test(e))return $("#aE").textContent="Неверный email";
 if(p.length<6)return $("#aE").textContent="Пароль слишком короткий";
 const us=users(),h=await sha(p);
 if(authMode==="up"){if(us[e])return $("#aE").textContent="Такой email уже есть";us[e]={h,premium:false};S("om_users",us)}
 else if(!us[e]||us[e].h!==h)return $("#aE").textContent="Неверный email или пароль";
 S("om_cur",e);$("#pw").value="";dAuth.close();loadUser();
}
$("#aOk").onclick=doAuth;$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")doAuth()});
$("#bPrem").onclick=()=>{closeSb();if(!cur()){authMode="in";authUI();return dAuth.showModal()}$("#pE").textContent=isPrem()?"Premium уже активен ✓":"";dPrem.showModal()};
$("#pOk").onclick=()=>{if($("#code").value.trim().toLowerCase()!==ADMIN_CODE.toLowerCase())return $("#pE").textContent="Неверный код";const us=users();us[cur()].premium=true;S("om_users",us);$("#code").value="";$("#pE").textContent="Premium активирован ✓";ui()};
$("#pOff").onclick=()=>{const us=users();if(cur()&&us[cur()]){us[cur()].premium=false;S("om_users",us);ui();$("#pE").textContent="Premium отключён"}};

async function ask(model,msgs,st){
 try{
  for(let a=0;a<3;a++){
   const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),70000);
   try{
    const r=await fetch(API+"openai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,messages:msgs,private:true}),signal:ac.signal});
    clearTimeout(tm);
    if(r.status===429){st("Очередь, ждём…");await sleep(16000);continue}
    const t=await r.text();if(!r.ok)throw new Error(t.slice(0,150));
    try{const j=JSON.parse(t);return j.choices?.[0]?.message?.content||t}catch(e){return t}
   }catch(e){clearTimeout(tm);if(a===2)throw e;await sleep(1200)}
  }
  throw new Error("busy");
 }catch(err){
  st("Пробуем запасной канал…");
  const last=msgs.filter(m=>m.role==="user").slice(-1)[0].content.slice(0,1500);
  const r=await fetch(API+encodeURIComponent(last)+"?model="+encodeURIComponent(model)+"&system="+encodeURIComponent(msgs[0].content.slice(0,400)));
  const t=await r.text();if(!r.ok||!t.trim())throw new Error("Сервис ИИ сейчас занят. Попробуйте через минуту.");return t;
 }
}
async function send(){
 if(busy)return;const t=$("#q").value.trim();if(!t)return;
 if(!cur()){authMode="in";authUI();return dAuth.showModal()}
 const pr=isPrem(),ms=MODELS,sel=ms.find(m=>m.id===$("#model").value)||ms[0];
 if(mode==="cmp"&&!pr)return $("#bPrem").click();
 if(!pr&&sel.p){$("#st").textContent="Эта модель доступна в Premium 🔒";return}
 if(!pr&&cnt()>=FREE_LIMIT){$("#st").textContent="Лимит на сегодня исчерпан. Premium снимает лимит.";return}
 const c=chat();$("#q").value="";$("#q").style.height="50px";
 c.m.push({role:"user",content:t});if(c.m.length===1)c.t=t.slice(0,32);
 busy=true;$("#bSend").disabled=true;ui();
 const ctx=c.m.filter(m=>!m.err).slice(-10).map(m=>({role:m.role,content:m.content}));
 const msgs=[{role:"system",content:SYS[mode==="cmp"?"chat":mode]},...ctx];
 const targets=mode==="cmp"?ms.slice(0,3):[sel];let ok=false;
 for(const m of targets){
  const st=x=>$("#st").textContent=x;st("✿ "+m.n+" думает…");
  try{c.m.push({role:"assistant",content:await ask(m.id,msgs,st),label:targets.length>1?m.n:""});ok=true}
  catch(e){c.m.push({role:"assistant",content:"⚠ "+e.message,err:1,label:m.n})}
  draw();
 }
 if(ok&&!pr)S("om_c_"+cur()+day(),cnt()+1);
 $("#st").textContent="";busy=false;$("#bSend").disabled=false;saveCh();ui();
}
$("#bSend").onclick=send;
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&innerWidth>800){e.preventDefault();send()}});
$("#q").addEventListener("input",e=>{e.target.style.height="50px";e.target.style.height=Math.min(140,e.target.scrollHeight)+"px"});

(async()=>{ // подгрузка списка моделей
 try{
  const r=await fetch(API+"models"),j=await r.json();
  const a=j.map(m=>typeof m==="string"?{name:m}:m).filter(m=>m.name&&!/audio|midi|unity|evil|roblox|bidara|rtist|image|search/i.test(m.name)&&(!m.output_modalities||m.output_modalities.includes("text"))).slice(0,8);
  if(a.length>1){const fi=Math.max(0,a.findIndex(m=>m.name==="openai"));
   MODELS=a.map((m,i)=>({n:(m.description||m.name).split(" - ")[0].slice(0,26),id:m.name,p:i!==fi}));ui()}
 }catch(e){}
})();
for(let i=0;i<12;i++){const p=document.createElement("span");p.className="petal";p.textContent="✿";p.style.left=Math.random()*100+"vw";p.style.fontSize=12+Math.random()*14+"px";p.style.animationDuration=9+Math.random()*10+"s";p.style.animationDelay=-Math.random()*15+"s";document.body.appendChild(p)}
loadUser();
</script>
</body>
</html>
